services:
  - type: web
    name: ai-keyboard-api
    env: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci && npx prisma generate --schema api/prisma/schema.prisma && npm run api:build
    preDeployCommand: npx prisma migrate deploy --schema api/prisma/schema.prisma
    startCommand: npm run start --workspace api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-keyboard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 3600
      - key: RATE_LIMIT_GENERATE_ANON
        value: 30
      - key: RATE_LIMIT_GENERATE_AUTHED
        value: 120
      - key: MAX_REQUEST_BODY_BYTES
        value: 65536

databases:
  - name: ai-keyboard-db
    plan: free
    region: oregon
    databaseName: aikeyboard
    user: aikeyboard
