name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    name: API (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aikeyboard
          POSTGRES_PASSWORD: aikeyboard
          POSTGRES_DB: aikeyboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aikeyboard -d aikeyboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aikeyboard:aikeyboard@localhost:5432/aikeyboard?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate --schema api/prisma/schema.prisma
      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema api/prisma/schema.prisma
      - run: npm run api:typecheck
      - run: npm run api:lint
      - run: npm run api:test
      - run: npm run api:build

  mobile:
    name: Mobile (lint, typecheck, jest-expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace mobile
      - run: npm run lint --workspace mobile
      # js-only suites: no emulator or device is involved. IME instrumentation is plan T9.3.
      - run: npm run test --workspace mobile

  contracts:
    name: Shared contracts (typecheck, drift tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace shared-contracts
      - run: npm run test --workspace shared-contracts

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: the deployed backend's production tree. `npm audit` repo-wide is not used
      # because `expo` lists its Metro/dev-server toolchain under "dependencies", so those
      # advisories can never be cleared from our side and would mask backend regressions.
      - name: Fail on high/critical advisories in the api production tree
        run: node scripts/audit-workspace.mjs --workspace api --fail-on high
      # Informational: everything else, including the mobile toolchain. Reviewed manually.
      - name: Advisory report (full production tree)
        continue-on-error: true
        run: node scripts/audit-workspace.mjs --report-only

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        continue-on-error: true
